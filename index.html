<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="PowerGrid Tycoon – run an electric company from 2030 to 2049.">
  <title>PowerGrid Tycoon</title>
  <link rel="icon" href="assets/icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PowerGrid">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <header id="topbar" class="topbar"></header>

    <main id="map-area" class="map-area">
      <canvas id="map" class="map-canvas" aria-label="Map"></canvas>
    </main>

    <aside id="sidepanel" class="sidepanel" aria-label="Panel"></aside>
    <div id="scrim" class="scrim" hidden></div>

    <footer id="newsbar" class="newsbar" role="status" aria-live="polite"></footer>

    <nav id="bottombar" class="bottombar" aria-label="Panels"></nav>
  </div>

  <div id="screen-root"></div>

  <noscript>PowerGrid Tycoon needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
